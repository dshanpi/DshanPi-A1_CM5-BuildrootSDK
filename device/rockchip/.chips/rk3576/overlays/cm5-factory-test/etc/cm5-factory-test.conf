# CM5 Base V1.0 - literal key=value, never interpreted by a shell.
audio_card=auto
# auto uses plughw:<ES8388 card>,0. pulse requires explicit ES8388 routing.
audio_pcm=auto
# Empty auto-maps CH334F downstream port 1/2; override after physical verification.
usb1_port=
usb2_port=
# Empty detects the Type-C USB controller or a configured USB gadget.
typec_port=
tf_device=auto
# auto maps NVMe by PCIe0/1 controller topology, never by NVMe numbering.
# Optional /dev/nvmeXnY override must belong to the selected slot.
m2_0_device=auto
m2_1_device=auto
# 0=USB Hub boot profile; 1=separately booted PCIe1 profile. No mux switching.
pcie1_mode=0
# Verified on current CM5 SDK: FPC4 / FPC7 / FPC6 ISP mainpaths.
# Recheck media topology if the kernel or enabled cameras change.
csi1_video=/dev/video33
csi2_video=/dev/video51
csi3_video=/dev/video42
# Legacy option accepted for old configs; V1.2 has no RTC test.
rtc_device=
# Legacy LED/fan/UART and ethernet-peer fields remain parseable in old configs.
